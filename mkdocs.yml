site_name: Tin docs
site_url: https://randomusert-s-mods.github.io/tin-docs/
site_description: Documentation for Tin mods by Randomusert
site_author: Randomusert


repo_url: https://github.com/randomusert-s-mods/tin-docs
edit_uri: https://github.com/randomusert-s-mods/tin-docs/tree/main/docs 

# Theme
theme:
  name: material
  locale: en
  color_mode: auto
  user_color_mode_toggle: true
  features:
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - toc.follow
    - content.code.annotate
    - content.action.view


# Nav
nav:
  - Home: index.md
  - Tincore: tincore/index.md
  - tincraft 2: tincraft2/index.md

